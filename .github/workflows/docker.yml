name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # 讓 verify 直接沿用這裡產生的標籤，不要自己去拼短 hash
      image: ${{ steps.pick.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # pull request 只驗證建得起來，不推上 registry
      - name: 登入 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 產生標籤
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 建置並推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 取出第一個標籤給後續步驟用
        id: pick
        run: echo "image=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> "$GITHUB_OUTPUT"

  # 實際把映像檔跑起來，確認服務起得來
  verify:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: 登入 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 起容器打端點
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          # 不帶 --with-ingest，避免在 CI 裡打外部 API
          docker run -d --name wildmap-test -p 8000:8000 \
            "$IMAGE" python -m wildmap serve --host 0.0.0.0 --port 8000

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/status > /dev/null; then
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:8000/ > /dev/null
          curl -sf http://127.0.0.1:8000/api/status
          echo ""
          echo "--- 容器日誌 ---"
          docker logs wildmap-test
          docker rm -f wildmap-test
